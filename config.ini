[DesktopRunner]
; Адреса веб-сторінки для відображення на робочому столі
Url=http://desktop2.local

; Номер монітора (0 = основний, 1 = другий тощо)
Screen=0

; Дозволити інструменти розробника за клавішею F12
DevTools=true

; Дозволити стандартне контекстне меню браузера при правому кліку
ContextMenu=false
